<style>

let cur=0,selAns=Array(totalQ).fill(null),reviewIndex=0,sec=0,tInt;
let grid=document.getElementById('grid');
Q.forEach((_,i)=>{let d=document.createElement('div');d.className='qn';d.innerText=i+1;d.onclick=()=>{cur=i;showQ();closePopup();};grid.appendChild(d);});
function openPopup(){document.getElementById('qPopup').classList.add('show');updGrid();}
function closePopup(){document.getElementById('qPopup').classList.remove('show');}
function updGrid(){[...grid.children].forEach((e,i)=>{e.className='qn'+(i==cur?' act':'')+(selAns[i]!=null&&i!=cur?' done':'');});}
function startQuiz(){if(!cName.value){alert('नाम लिखें');return;}document.getElementById('p-start').style.display='none';document.getElementById('p-quiz').style.display='block';tInt=setInterval(()=>{sec++;let m=Math.floor(sec/60),s=sec%60;timer.innerText=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;},1000);showQ();}
function showQ(){let qq=Q[cur];qL.innerText='प्रश्न '+(cur+1)+' / '+totalQ;document.getElementById('qT').innerText=qq.q;qbadge.innerText=(cur+1)+'/'+totalQ+'Q';bar.style.width=((cur+1)/totalQ*100)+'%';opts.innerHTML=qq.opts.map((o,i)=>`<div class="opt ${selAns[cur]==i?'sel':''}" onclick="selAns[${cur}]=${i};showQ()">${String.fromCharCode(65+i)}. ${o}</div>`).join('');updGrid();}
function next(){if(cur<totalQ-1){cur++;showQ();}else showResult();}
function prev(){if(cur>0){cur--;showQ();}}
function showResult(){clearInterval(tInt);document.getElementById('p-quiz').style.display='none';document.getElementById('p-result').style.display='block';let correct=0,attempt=0,notAttempt=0;selAns.forEach((v,i)=>{if(v==4||v==null)notAttempt++;else{attempt++;if(v==Q[i].ans)correct++;}});let wrong=attempt-correct;let neg=wrong*(1/3);let finalScore=correct-neg;score.innerText=finalScore.toFixed(2)+'/'+totalQ;scoreP.innerText='नाम: '+cName.value+' | सही: '+correct+' | गलत: '+wrong+' | E/छोड़ा: '+notAttempt;negInfo.innerText='BPSC TRE 4 नया नियम: Final = सही - (गलत×1/3) | E पर कोई नेगेटिव नहीं';reviewIndex=0;showAnalysis();}
function toggleReview(){reviewBox.style.display=reviewBox.style.display=='none'?'block':'none';}
function showAnalysis(){let qq=Q[reviewIndex];slideNo.innerText=(reviewIndex+1)+' / '+totalQ;analysisCard.innerHTML=`<b style="color:#166534">Q${reviewIndex+1}</b>: ${qq.q}<br><br>✓ सही: ${qq.opts[qq.ans]}<br>आपका: ${selAns[reviewIndex]!=null?qq.opts[selAns[reviewIndex]]:'छोड़ा'}<br><br>विश्लेषण: ${qq.analysis}<br><br>Fact:<br>${qq.facts.map(f=>`<div class="fact">${f}</div>`).join('')}`;}
function slideNext(){if(reviewIndex<totalQ-1){reviewIndex++;showAnalysis();}}
function slidePrev(){if(reviewIndex>0){reviewIndex--;showAnalysis();}}
</script>
